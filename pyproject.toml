[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sinhala-ocr-studio"
version = "0.3.0"
description = "Offline-first Sinhala document workspace"
requires-python = ">=3.11,<3.13"
dependencies = ["PySide6==6.8.3", "Pillow==11.2.1", "pypdf==5.4.0", "python-docx==1.1.2", "pytesseract==0.3.13", "ziamath==0.13", "latex2mathml==3.81.1", "pypdfium2==4.30.1", "keyring==25.6.0"]

[project.optional-dependencies]
equations = ["rapid-latex-ocr==0.0.9", "onnxruntime==1.20.1", "opencv-python==4.11.0.86", "tokenizers==0.21.1", "numpy==1.26.4", "requests==2.32.3", "tqdm==4.67.1"]
dev = ["pytest==8.3.5", "ruff==0.11.5"]

[project.scripts]
sinhala-ocr-studio = "sinhala_ocr.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
sinhala_ocr = ["assets/*.ttf", "assets/OFL.txt", "assets/equation_smoke.png", "assets/equation_models/*", "assets/equation_licenses/*.txt"]
